plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("org.jetbrains.kotlin.plugin.compose")
    id("org.jetbrains.kotlin.kapt")
    id("com.google.dagger.hilt.android")
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def releaseStorePath = System.getenv("MESH_STORE_FILE") ?: keystoreProperties.getProperty("storeFile")
def releaseStorePassword = System.getenv("MESH_STORE_PASSWORD") ?: keystoreProperties.getProperty("storePassword")
def releaseKeyAlias = System.getenv("MESH_KEY_ALIAS") ?: keystoreProperties.getProperty("keyAlias")
def releaseKeyPassword = System.getenv("MESH_KEY_PASSWORD") ?: keystoreProperties.getProperty("keyPassword")
def releaseStoreFile = null
if (releaseStorePath != null && !releaseStorePath.toString().trim().isEmpty()) {
    def candidate = file(releaseStorePath)
    if (!candidate.exists()) candidate = rootProject.file(releaseStorePath)
    if (candidate.exists()) releaseStoreFile = candidate
}
def hasReleaseSigning = releaseStoreFile != null &&
        releaseStorePassword != null && !releaseStorePassword.toString().isEmpty() &&
        releaseKeyAlias != null && !releaseKeyAlias.toString().isEmpty() &&
        releaseKeyPassword != null && !releaseKeyPassword.toString().isEmpty()

android {
    namespace "com.devil1716.bluetoothmanet"
    compileSdk 34

    defaultConfig {
        applicationId "com.devil1716.bluetoothmanet"
        minSdk 21
        targetSdk 34
        versionCode 27
        versionName "1.4.1"

        testInstrumentationRunner "androidx.test.junit.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.activity:activity:1.9.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation platform("androidx.compose:compose-bom:2024.09.03")
    implementation "androidx.compose.ui:ui"
