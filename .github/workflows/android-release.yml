name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v1.4.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Forbid tracked keystores and hardcoded signing passwords
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.jks$|\.keystore$'; then
            echo "Keystore files must not be tracked."
            exit 1
          fi
          if grep -E 'storePassword[[:space:]]+"[^"$]' app/build.gradle \
            || grep -E 'keyPassword[[:space:]]+"[^"$]' app/build.gradle; then
            echo "Signing passwords must not be hardcoded in Gradle."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Decode release keystore
        if: ${{ secrets.MESH_KEYSTORE_BASE64 != '' }}
        env:
          MESH_KEYSTORE_BASE64: ${{ secrets.MESH_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$MESH_KEYSTORE_BASE64" | base64 -d > app/keystore/mesh-update.jks

      - name: Build release APK
        if: ${{ secrets.MESH_KEYSTORE_BASE64 != '' && secrets.MESH_STORE_PASSWORD != '' && secrets.MESH_KEY_PASSWORD != '' }}
        env:
          MESH_STORE_FILE: app/keystore/mesh-update.jks
          MESH_STORE_PASSWORD: ${{ secrets.MESH_STORE_PASSWORD }}
          MESH_KEY_ALIAS: ${{ secrets.MESH_KEY_ALIAS }}
          MESH_KEY_PASSWORD: ${{ secrets.MESH_KEY_PASSWORD }}
        run: |
          export MESH_KEY_ALIAS="${MESH_KEY_ALIAS:-mesh}"
          ./gradlew assembleRelease

      - name: Skip APK when signing secrets are absent
        if: ${{ secrets.MESH_KEYSTORE_BASE64 == '' || secrets.MESH_STORE_PASSWORD == '' || secrets.MESH_KEY_PASSWORD == '' }}
        run: |
          echo "Release signing secrets are not configured; this job will not attach an APK."
          echo "Set MESH_KEYSTORE_BASE64, MESH_STORE_PASSWORD, MESH_KEY_ALIAS, and MESH_KEY_PASSWORD to build on CI."
          echo "Do not attach app-debug.apk as the product artifact."

      - name: Upload workflow artifact
        if: ${{ secrets.MESH_KEYSTORE_BASE64 != '' && secrets.MESH_STORE_PASSWORD != '' && secrets.MESH_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-manet-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to release
        if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && secrets.MESH_KEYSTORE_BASE64 != '' && secrets.MESH_STORE_PASSWORD != '' && secrets.MESH_KEY_PASSWORD != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
