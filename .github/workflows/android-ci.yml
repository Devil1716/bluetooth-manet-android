name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbid tracked keystores and hardcoded signing passwords
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.jks$|\.keystore$'; then
            echo "Keystore files must not be tracked. Load them from secrets or an untracked local file."
            exit 1
          fi
          if grep -E 'storePassword[[:space:]]+"[^"$]' app/build.gradle \
            || grep -E 'keyPassword[[:space:]]+"[^"$]' app/build.gradle; then
            echo "Signing passwords must not be hardcoded in Gradle."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug
